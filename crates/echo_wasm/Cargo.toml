[package]
name = "echo_wasm"
version = "0.0.1"
edition = "2024"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
echo_diagnostics = { path = "../echo_diagnostics" }
echo_parser = { path = "../echo_parser" }
echo_resolver = { path = "../echo_resolver" }
echo_source = { path = "../echo_source" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.126"
